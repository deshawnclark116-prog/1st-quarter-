name: First-quarter quality gate

on:
  push:
    branches: ["q1-verification-grading-v2"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-compile and run deterministic unit tests
        run: |
          python -m compileall -q quarterbot.py quarter_guard.py quarter_challenger.py quarter_grade.py
          python -m unittest discover -s tests -v
