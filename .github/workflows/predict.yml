name: First-quarter predictions

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test parser and projection logic
        run: python -m unittest discover -s tests -v
      - name: Generate projections
        run: python quarterbot.py
      - name: Add report to run summary
        if: always()
        run: |
          if [ -f predictions.md ]; then
            cat predictions.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.md predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update first-quarter predictions"
            git push origin HEAD:main
          fi
