name: Year-separated Q1 candidate transfer experiment
on:
  push:
    branches: ["research-q1-opportunity-v3"]
    paths: [".github/workflows/research_transfer.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install modeling dependencies
        run: python -m pip install "scikit-learn>=1.5,<1.9"
      - name: Train on 2025 only and test separately on 2026
        run: python research_transfer.py
      - name: Save transfer results, no model promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/year_transfer-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Q1 prior-year transfer validation"
            git pull --rebase origin research-q1-opportunity-v3
            git push origin HEAD:research-q1-opportunity-v3
          fi
