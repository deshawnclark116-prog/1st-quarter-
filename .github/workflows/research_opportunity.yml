name: Q1 independent opportunity model research

on:
  push:
    branches: ["research-q1-opportunity-v3"]
    paths:
      - "research_opportunity.py"
      - "quarter_opportunity.py"
      - "tests/test_opportunity.py"
      - ".github/workflows/research_opportunity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: q1-opportunity-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python -m compileall -q quarter_opportunity.py research_opportunity.py
          python -m unittest discover -s tests -v
      - name: Run historical NBA opportunity and distribution comparisons
        run: python research_opportunity.py --from-date 2026-10-20 --through-date 2026-11-12 --max-games 180
      - name: Persist research results on branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/opportunity-v3.json research_results/opportunity-v3.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record non-promoted independent Q1 model research"
            git pull --rebase origin research-q1-opportunity-v3
            git push origin HEAD:research-q1-opportunity-v3
          fi
