name: First-quarter independent ML challenger research
on:
  push:
    branches: ["research-q1-opportunity-v3"]
    paths:
      - "research_results/opportunity-v3.csv"
      - ".github/workflows/research_meta.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic research dependency
        run: python -m pip install "scikit-learn>=1.5,<1.9"
      - name: Compare feature-aware supervised models
        run: python research_meta.py
      - name: Save non-promoted research comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/meta-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive independent feature-based Q1 research"
            git pull --rebase origin research-q1-opportunity-v3
            git push origin HEAD:research-q1-opportunity-v3
          fi
