name: Six-game production-matched NBA Q1 research
on:
  push:
    branches: ["research-q1-opportunity-v3"]
    paths: [".github/workflows/research_six.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests before scoring
        run: python -m unittest discover -s tests -v
      - name: Recreate six-game live baseline and shot model fairly
        run: python research_six.py
      - name: Persist matched-horizon comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/opportunity-v3-six.json research_results/opportunity-v3-six.csv
          if ! git diff --cached --quiet; then
            git commit -m "Archive six-game production-matched research"
            git pull --rebase origin research-q1-opportunity-v3
            git push origin HEAD:research-q1-opportunity-v3
          fi
